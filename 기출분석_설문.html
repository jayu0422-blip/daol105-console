<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다올105 기출분석 설문 (강사용)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2530;--mut:#7b8493;--line:#e7eaef;--brand:#0f2038;--accent:#2f6feb;--ok:#1f8a4c;--radius:14px;--sans:"Pretendard",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:10px;height:58px;flex-wrap:wrap}
.title{font-weight:800;font-size:17px}.title b{color:#e3c877}
.spacer{flex:1}
.btn{font-family:var(--sans);font-weight:700;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13.5px;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn.accent{background:var(--accent);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.line{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.intro{background:#eef4ff;border:1px solid #cfe0ff;border-radius:12px;padding:13px 15px;font-size:13px;color:#274b8f;margin:16px 0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.sec>h2{margin:0;padding:13px 18px;font-size:15px;background:#fbfcfd;border-bottom:1px solid var(--line);color:var(--brand)}
.sec .b{padding:16px 18px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
label.q{display:block;font-weight:700;font-size:13.5px;margin:0 0 6px}
label.q .subj{display:inline-block;background:#eaf1ff;color:var(--accent);border-radius:5px;font-size:11px;padding:1px 7px;margin-right:6px;vertical-align:1px}
input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.5;min-height:64px}
::placeholder{color:#aab3c0;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.subjfield{display:none}
.subjfield.on{display:block}
.hide{display:none!important}
.actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(245,246,248,0),var(--bg) 30%);padding:14px 0 24px;display:flex;gap:8px;flex-wrap:wrap}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:8px 0 20px}
.out h3{margin:0 0 8px;font-size:15px}
.out textarea{min-height:280px;font-size:13px;white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace}
.status{font-size:13px;min-height:18px;padding:4px 0;color:var(--ok)}
.hint{font-size:12px;color:var(--mut);margin:5px 0 0}
</style>
  <link rel="stylesheet" href="mobile-fix.css?v=e768566c"/>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="title">다올105 <b>기출분석 설문</b> · 강사용</span>
  <span class="spacer"></span>
  <button class="btn ghost sm" onclick="loadExample()">예시 채우기(윤다올)</button>
  <button class="btn ghost sm" onclick="clearAll()">비우기</button>
</div></header>

<div class="wrap">
  <div class="intro">
    <b>이 설문 = 좋은 기출분석 원고의 재료입니다.</b> 시험지를 직접 분석한 <b>강사만 아는 정보</b>(저번·작년 시험과의 차이, 1등급/A등급 가른 문제, 킬러문항, 우리 대비방식 등)를 채워주세요.
    <b>모르는 값은 비워두세요</b>(빈칸은 원고에 지어내지 않습니다). 다 쓰면 <b>맨 아래 '인포 전달용 생성'</b> → 나온 텍스트를 인포에 전달하면, 인포가 콘솔에 붙여넣어 <b>랜딩·블로그·인스타·유튜브 4종을 자동 생성·배포</b>합니다.
  </div>

  <div id="form"></div>

  <div class="actions">
    <button class="btn ok" onclick="genOutput()">📄 인포 전달용 생성</button>
    <button class="btn line" onclick="saveDraft()">임시 저장</button>
    <span class="status" id="topStatus"></span>
  </div>

  <div class="out hide" id="outBox">
    <h3>📤 인포 전달용 텍스트 <span class="hint" style="font-weight:400">— 복사해서 인포에게 보내세요 (또는 콘솔 '강사 자료' 칸에 붙여넣기)</span></h3>
    <textarea id="outText" readonly></textarea>
    <div class="actions" style="position:static;padding:10px 0 0">
      <button class="btn accent" onclick="copyOut()">복사</button>
      <button class="btn line" onclick="downloadOut()">TXT 다운로드</button>
      <span class="status" id="outStatus"></span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SUBJECTS = ['국어','영어','수학'];
const SCHOOLS = ['미강중','윤슬중','은가람중','미사중','미사강변고','미사고','하남고','기타(직접입력)'];

const SECTIONS = [
 {title:'1. 강사·학교·시험 식별', fields:[

   {key:'textbook',label:'교과서·부교재(출판사·저자)',type:'textarea',ph:'예: 교과서 능률(김성곤) / 부교재 수능특강 라이트 · 학평·EBS'},

 next_action:'2학기 중간 대비반 8/25 개강, 무료 기출 진단테스트 30분(예약제). 할인 등 미확정 사항은 표기하지 않음.',

function fieldHtml(f){
  const subjAttr = f.subject ? `data-subj="${f.subject}"` : '';
  const cls = f.subject ? 'fld subjfield' : 'fld';
  const badge = f.subject ? `<span class="subj">${f.subject} 전용</span>` : '';
  let input;
  if(f.type==='select'){
    input = `<select id="f_${f.key}" onchange="onChange('${f.key}')">`+
      `<option value="">선택</option>`+f.options.map(o=>`<option>${o}</option>`).join('')+`</select>`;
  }else if(f.type==='textarea'){
    input = `<textarea id="f_${f.key}" placeholder="${(f.ph||'').replace(/"/g,'&quot;')}" oninput="autosave()"></textarea>`;
  }else{
    input = `<input type="text" id="f_${f.key}" placeholder="${(f.ph||'').replace(/"/g,'&quot;')}" oninput="autosave()">`;
  }
  return `<div class="${cls}" ${subjAttr}><label class="q">${badge}${f.label}</label>${input}</div>`;
}
function renderForm(){
  $('form').innerHTML = SECTIONS.map(sec=>{
    // section 1: name/subject/school/grade/course in grid, rest full
    const inner = sec.fields.map(fieldHtml).join('');
    return `<div class="sec"><h2>${sec.title}</h2><div class="b">${inner}</div></div>`;
  }).join('');
  applySubjectVisibility();
}
function onChange(key){ if(key==='subject') applySubjectVisibility(); autosave(); }
function applySubjectVisibility(){
  const subj = ($('f_subject')&&$('f_subject').value)||'';
  document.querySelectorAll('.subjfield').forEach(el=>{
    el.classList.toggle('on', el.dataset.subj===subj);
  });
}
function getVals(){ const v={}; SECTIONS.forEach(s=>s.fields.forEach(f=>{ const el=$('f_'+f.key); if(el) v[f.key]=el.value; })); return v; }
function setVals(v){ SECTIONS.forEach(s=>s.fields.forEach(f=>{ const el=$('f_'+f.key); if(el&&v[f.key]!=null) el.value=v[f.key]; })); applySubjectVisibility(); }

function buildOutput(){
  const v=getVals(); const subj=v.subject||'';
  let out='════════════════════════════════════\n다올105 기출분석 · 강사 입력 자료\n작성 강사: '+(v.instructor_name||'(미기재)')+'  |  과목: '+(subj||'(미선택)')+'\n════════════════════════════════════\n';
  SECTIONS.forEach(sec=>{
    const lines=[];
    sec.fields.forEach(f=>{
      if(f.key==='instructor_name'||f.key==='subject') return;
      if(f.subject && f.subject!==subj) return;
      const val=(v[f.key]||'').trim(); if(!val) return;
      const lab=f.label.replace(/\(.*$/,'').trim();
      lines.push('· '+lab+': '+val);
    });
    if(lines.length) out+='\n['+sec.title.replace(/^\d+\.\s*/,'')+']\n'+lines.join('\n')+'\n';
  });
  out+='\n────────────────────────────────────\n[생성 지침·정직성] 위 자료에 없는 성과·합격·수강생 수·할인율은 지어내지 말 것(빈 항목 근거 사용 금지). 추정치는 \'강사 추정\', 개념 도표는 \'개념 모델\', 미공개 등급컷은 \'체감\'. 단정("무조건 1등급/100점 보장") 금지 → 완화. 산출: 랜딩/블로그/인스타 카드/유튜브 4종, 다올105 설득 7비트 순서 준수.';
  return out;
}
function genOutput(){
  if(!($('f_subject').value)){ toast('topStatus','과목을 먼저 선택해주세요.',false); return; }
  $('outText').value=buildOutput(); $('outBox').classList.remove('hide');
  $('outBox').scrollIntoView({behavior:'smooth'}); toast('topStatus','생성됨 ✓ 아래 텍스트를 인포에 전달하세요.',true);
}
async function copyOut(){ try{ await navigator.clipboard.writeText($('outText').value); toast('outStatus','복사됨 ✓',true);}catch(e){ toast('outStatus','복사 실패 — 직접 선택 복사',false);} }
function downloadOut(){
  const v=getVals(); const name=(v.instructor_name||'강사')+'_'+(v.school||'')+'_'+(v.exam_name||'기출분석');
  const a=document.createElement('a'); a.href='data:text/plain;charset=utf-8,'+encodeURIComponent($('outText').value);
  a.download=name.replace(/[\\/:*?"<>|]/g,'')+'.txt'; a.click(); toast('outStatus','다운로드 ✓',true);
}
function loadExample(){ setVals(EXAMPLE); autosave(); toast('topStatus','윤다올(영어·미사강변고) 예시를 채웠습니다. 생성 눌러보세요.',true); }
function clearAll(){ if(!confirm('모두 비울까요?')) return; setVals(Object.fromEntries(SECTIONS.flatMap(s=>s.fields.map(f=>[f.key,''])))); localStorage.removeItem('gichulDraft'); $('outBox').classList.add('hide'); toast('topStatus','비웠습니다.',true); }
function autosave(){ localStorage.setItem('gichulDraft', JSON.stringify(getVals())); }
function saveDraft(){ autosave(); toast('topStatus','임시 저장됨 ✓ (이 브라우저)',true); }
function toast(el,msg,ok){ const e=$(el); if(!e)return; e.textContent=msg; e.style.color= ok===false?'#c0392b':'#1f8a4c'; }

renderForm();
try{ const s=localStorage.getItem('gichulDraft'); if(s) setVals(JSON.parse(s)); }catch(e){}
// 강사 페이지(시간표 앱)에서 넘어올 때 URL 프리필: ?teacher=&subject=&school=&grade=&course=&period=
(function(){
  const p=new URLSearchParams(location.search);
  const map={teacher:'instructor_name',subject:'subject',school:'school',grade:'grade',course:'course'};
  Object.entries(map).forEach(([q,k])=>{ const v=p.get(q); if(v&&$('f_'+k)) $('f_'+k).value=v; });
  applySubjectVisibility(); autosave();
  const per=p.get('period'), sc=p.get('school'), tc=p.get('teacher');
  if(per||sc||tc){ const b=document.createElement('div'); b.className='intro'; b.style.borderColor='#bfe3cd'; b.style.background='#eaf6ef'; b.style.color='#1f5f3d';
    /* 주소창에서 온 값이라 그대로 innerHTML 에 넣으면 링크 하나로 스크립트가 실행된다.
       이 페이지와 같은 저장소에 API 키·깃허브 토큰이 브라우저에 저장돼 있어 위험하다. */
    const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    b.innerHTML='📊 <b>'+esc([per,sc].filter(Boolean).join(' · '))+'</b> 기출분석 설문'
      +(tc?(' ('+esc(tc)+' 선생님)'):'')+' — 강사명·학교가 자동 입력됐습니다. 시험지 분석 정보만 채워주세요.';
    document.querySelector('.wrap').insertBefore(b, $('form')); }
})();
</script>
