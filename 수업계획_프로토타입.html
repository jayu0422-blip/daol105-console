<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>다올105 · 월간 수업계획 제출 (프로토타입)</title>
<style>
:root{
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ink:#1b1f2a; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6f9; --card:#fff;
  --brand:#f59e0b; --brand-ink:#b45309; --ok:#059669; --danger:#dc2626; --info:#2563eb;
  --clinic:#7c3aed; --boost:#db2777;
  --tap:48px;                      /* 최소 탭 타깃 */
  --barh:76px;                     /* 하단 고정바 높이 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  overflow-x:hidden;padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px) + 8px)}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ── 상단 고정 헤더 ── */
.hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-top,0px));}
.hd .r1{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:800;margin:0;flex:1;letter-spacing:-.02em}
.hd .who{font-size:12px;color:var(--muted);font-weight:700}
.pgbar{height:4px;background:#eef0f4;border-radius:99px;margin-top:8px;overflow:hidden}
.pgbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.hdsub{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.due{font-weight:800;color:var(--danger)}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;
  box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:hidden}
.card .ch{padding:13px 14px;display:flex;align-items:flex-start;gap:10px}
.card .ct{font-weight:800;font-size:15px;flex:1;min-width:0}
.card .cs{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.badge{flex:none;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-ok{background:#ecfdf5;color:#047857}
.b-need{background:#fff7ed;color:var(--brand-ink)}
.b-auto{background:#eff6ff;color:#1d4ed8}
.b-clinic{background:#f5f3ff;color:#6d28d9}

/* ── 표지 ── */
.cover{background:linear-gradient(160deg,#7c2d12,#b45309 62%,#f59e0b);color:#fff;
  border-radius:16px;padding:18px 16px;margin:14px 0}
.cover h2{margin:0 0 4px;font-size:19px;font-weight:800}
.cover .sub{font-size:13px;opacity:.95;margin-bottom:12px}
.cover ul{margin:0;padding-left:0;list-style:none;font-size:13.5px;line-height:1.75}
.cover li{padding-left:16px;position:relative}
.cover li::before{content:"•";position:absolute;left:3px}
.cover .note{background:rgba(255,255,255,.16);border-radius:9px;padding:8px 11px;margin-top:11px;font-size:12.5px}

/* ── 버튼 ── */
.btn{font:inherit;font-weight:800;border-radius:11px;border:1px solid var(--line);background:#fff;
  color:var(--ink);min-height:var(--tap);padding:0 16px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;font-size:14.5px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:#f8fafc;color:var(--muted)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:44px;font-size:13.5px;padding:0 12px;border-radius:9px}  /* 44 미만 금지(실측 감사) */

/* ── 하단 고정 액션바 (엄지 영역) ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.35}
.bar .sum b{color:var(--ink);font-size:13.5px}

/* ── 달력 ── */
.calwrap{padding:0 10px 12px}
.calhd{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
.calhd .m{font-weight:800;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;font-weight:800;color:#9099ab;padding:2px 0}
.dow.sun{color:var(--danger)}.dow.sat{color:var(--info)}
.cell{aspect-ratio:1/1;min-height:44px;border:1px solid #eef0f4;border-radius:10px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:700;cursor:pointer;position:relative;padding:0}
.cell.pad{border:none;background:transparent;pointer-events:none}
.cell .d{line-height:1}
.cell .t{font-size:9px;font-weight:800;line-height:1}
.cell.off{color:#c3c8d2;background:#fafbfc}         /* 수업 없는 요일 */
.cell.holi{background:#fef3f2;border-color:#fbd5d1;color:var(--danger)}
.cell.on{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}          /* 정규 */
.cell.clinic{background:#f5f3ff;border-color:#c4b5fd;color:#5b21b6}      /* 클리닉 */
.cell.boost{background:#fdf2f8;border-color:#f9a8d4;color:#9d174d}       /* 직전보강 */
.cell.cancel{background:#f3f4f6;border-color:#d1d5db;color:#9ca3af;text-decoration:line-through}
.cell .exam{position:absolute;top:2px;right:3px;font-size:8px;color:var(--brand-ink);font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:10px 4px 2px;font-size:11.5px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 회차 요약 */
.cnt{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:10px 4px 0;border-radius:11px;
  background:#f8fafc;border:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.cnt .n{font-size:17px;font-weight:900}
.cnt.warn{background:#fff7ed;border-color:#fed7aa;color:var(--brand-ink)}

/* ── 바텀 시트 ── */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .dim{position:absolute;inset:0;background:rgba(15,20,30,.45)}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
  padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto}
.sheet .hdl{width:38px;height:4px;border-radius:99px;background:#d7dbe2;margin:6px auto 12px}
.sheet h3{margin:0 0 3px;font-size:16.5px;font-weight:800}
.sheet .sh{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.opt{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;border:1px solid var(--line);
  border-radius:12px;background:#fff;padding:10px 13px;margin-bottom:8px;cursor:pointer;text-align:left;font:inherit}
.opt .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.opt .tx{flex:1;min-width:0}
.opt .tt{font-weight:800;font-size:14.5px}
.opt .td{font-size:12px;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--brand);background:#fffbeb;box-shadow:0 0 0 2px #fde68a inset}

/* ── 폼 ── */
.f{margin:11px 0}
.f label{display:block;font-size:12.5px;font-weight:800;color:#39404e;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:15px;min-height:var(--tap);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink)}
.f textarea{min-height:82px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.req{color:var(--danger);font-weight:900}
.err{border-color:var(--danger)!important;background:#fef2f2!important}
.errmsg{font-size:12px;color:var(--danger);font-weight:800;margin-top:4px}

.gate{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 13px;margin:11px 0}
.gate .gt{font-weight:800;color:var(--brand-ink);font-size:13.5px;margin-bottom:3px}
.gate .gd{font-size:12.5px;color:#92400e;line-height:1.55}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 18px);z-index:70;
  background:#1f2937;color:#fff;font-size:13.5px;font-weight:700;border-radius:11px;padding:11px 15px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.24);max-width:calc(100% - 28px)}
.toast button{background:none;border:none;color:#fbbf24;font:inherit;font-weight:800;cursor:pointer;
  min-height:32px;padding:0 4px}
.hide{display:none!important}
.muted{color:var(--muted)}
.log{font-size:12px;color:var(--muted);padding:8px 4px 0;line-height:1.7}
.log b{color:var(--ink)}

/* ═══════════ PC 웹 (≥900px) ═══════════
   모바일 세로 1단을 그대로 늘리면 좌우가 비고 바텀시트가 화면 전체 폭으로 깔린다.
   PC에서는 ① 본문 폭 확대 ② 목록 2단 ③ 달력+요약 2단 ④ 시트를 중앙 모달로 바꾼다. */
@media (min-width:900px){
  body{font-size:15.5px; padding-bottom:96px}
  .wrap{max-width:1080px;padding:0 24px}
  .hd{padding:14px 24px}
  .hd .r1{max-width:1080px;margin:0 auto}
  .hd h1{font-size:19px}
  .hdsub{max-width:1080px;margin:6px auto 0;font-size:13px}
  .pgbar{max-width:1080px;margin:10px auto 0}
  .bar .in{max-width:1080px}
  .bar{padding:12px 24px}
  .bar .sum{font-size:13.5px}
  .btn{min-height:46px}

  /* 표지 — 넓은 화면에서 문장이 한 줄로 늘어지지 않게 */
  .cover{padding:26px 28px;margin:20px 0}
  .cover h2{font-size:24px}
  .cover ul{columns:2;column-gap:28px}
  .cover li{break-inside:avoid}

  /* 반 목록 2단 */
  #app.list-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  #app.list-2col .card{margin:16px 0}
  #app.list-2col .log{grid-column:1/-1}

  /* 달력 화면 2단: 달력 | 요약·범례·안내 */
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;padding:0 18px 18px}
  .calside{display:flex;flex-direction:column;gap:0;padding-top:38px}
  .grid{gap:6px}
  .cell{min-height:62px;font-size:15px;border-radius:12px}
  .cell .t{font-size:11px}
  .dow{font-size:12.5px;padding:4px 0 6px}
  .legend{padding:12px 2px 4px;font-size:12.5px}
  .cnt{margin:10px 0 0}
  .gate{margin:12px 0 0!important}
  .calhd .m{font-size:17px}

  /* 바텀시트 → 중앙 모달 */
  .sheet .pan{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:460px;max-width:calc(100vw - 48px);max-height:80vh;border-radius:16px;padding:10px 20px 20px}
  .sheet .hdl{display:none}
  .sheet h3{font-size:18px;margin-top:6px}
  .opt{min-height:60px}
  .toast{bottom:104px}
}
/* 세로가 짧은 노트북(≤860px)에서 달력 한 화면에 들어오게 */
@media (min-width:900px) and (max-height:880px){
  /* aspect-ratio가 열 너비에서 높이를 끌어오므로 종횡비를 풀어야 낮아진다 */
  .cell{aspect-ratio:auto;height:62px;min-height:0;font-size:14px}
  .calside{padding-top:34px}
  .cover{padding:20px 24px;margin:14px 0}
}
/* 태블릿 세로(768~899px): 1단이되 폭을 넓혀 좌우 여백 낭비를 줄인다 */
@media (min-width:700px) and (max-width:899px){
  .wrap{max-width:680px}
  .bar .in{max-width:680px}
  .cell{min-height:56px;font-size:14px}
}
/* 아주 넓은 화면에서도 글줄이 과하게 길어지지 않게 */
@media (min-width:1400px){ .wrap{max-width:1180px} }
</style>
</head>
<body>

<div class="hd">
  <div class="r1">
    <h1 id="hTitle">2026년 9월 수업계획</h1>
    <span class="who" id="hWho">윤재영 선생님</span>
  </div>
  <div class="pgbar"><i id="pg"></i></div>
  <div class="hdsub">
    <span id="hStep">표지</span>
    <span>·</span>
    <span class="due" id="hDue">마감 8/22(토)</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="bar"><div class="in">
  <div class="sum" id="barSum">—</div>
  <button class="btn pri" id="barBtn">확인하러 가기</button>
</div></div>

<div class="sheet" id="sheet">
  <div class="dim" data-close="1"></div>
  <div class="pan" id="sheetPan"></div>
</div>

<div id="toastHost"></div>

<script>
/* =======================================================================
   다올105 월간 수업계획 제출 — 모바일 프로토타입
   목적: 375px 실기기 폭에서 탭 타깃·엄지영역·스크롤·오탭복구를 실제로 검증
   데이터: 실제 courses 28행 구조를 축약 반영 (윤재영 7반 → 3그룹)
   ======================================================================= */

/* ── 자동 월 전환 ──────────────────────────────────────────────
   규칙: 매달 15일이 지나면 "다음 달" 계획 제출 모드로 자동 전환된다.
   9월 16일에 열면 10월 계획, 10월 3일에 열면 여전히 10월 계획(마감 전).
   달이 바뀌면 저절로 따라간다 — 강사가 월을 고를 일이 없다. */
const NOW = new Date();                    // 실제 오늘
function targetMonth(now){
  let y = now.getFullYear(), m = now.getMonth() + 1;
  if (now.getDate() > 15) { m += 1; if (m > 12) { m = 1; y += 1; } }
  return { y, m };
}
const TM = targetMonth(NOW);
const YEAR = TM.y, MONTH = TM.m;
/* 마감 = 대상월 전월 22일 (기획서 §10 결정5 — 15일은 지필 한복판이라 22일 제안) */
function dueDate(y, m){
  let dy = y, dm = m - 1; if (dm < 1) { dm = 12; dy -= 1; }
  return new Date(dy, dm - 1, 22);
}

/* 공휴일 2026 전체 (수정본: 9/28 추석대체 없음 — 추석 연휴가 일요일과 안 겹침 / 6/3 지방선거 추가) */
const HOLI = {
  "2026-01-01":"신정",
  "2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴",
  "2026-03-01":"삼일절","2026-03-02":"삼일절 대체",
  "2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"부처님오신날 대체",
  "2026-06-03":"지방선거일","2026-06-06":"현충일",
  "2026-08-15":"광복절","2026-08-17":"광복절 대체",
  "2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴",
  "2026-10-03":"개천절","2026-10-05":"개천절 대체","2026-10-09":"한글날",
  "2026-12-25":"성탄절"
};
/* 담당교 지필 — 윤재영 = 하남고. 하남고 1차지필 10/12~16 (실데이터) */
const EXAM = {
  "하남고등학교": [{ term:"1차지필", month:10, days:[12,13,14,15,16] },
                  { term:"2차지필(고1,2)", month:12, days:[10,11,14,15,16] }]
};

/* 요일그룹 = (요일패턴 + 성격) 서명으로 접은 것. 실데이터 기준 윤재영 7반 → 3그룹 */
const GROUPS = [
  { id:"g1", label:"월·수·금 묶음", classes:["중2 영어정규반","중1 영어정규반","중3 영어정규반"],
    days:{1:"정",3:"정",5:"정"}, weekN:3, materialFee:null, textbook:"해커스 중학영문법 2학년" },
  { id:"g2", label:"화·목·토 묶음", classes:["중3 영어정규반","중1 영어정규반","중2 영어정규반"],
    days:{2:"정",4:"정",6:"정"}, weekN:3, materialFee:null, textbook:"" },
  { id:"g3", label:"하남고1 영어", classes:["하남고1 영어"],
    days:{5:"클",6:"정"}, weekN:1, materialFee:39000, textbook:"" },
];

/* ── 유틸 (seedMarks가 쓰므로 반드시 상태 초기화보다 위에) ── */
const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const dim=(y,m)=>new Date(y,m,0).getDate();
const dowOf=(y,m,d)=>new Date(y,m-1,d).getDay();
const DOWN=["일","월","화","수","목","금","토"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 상태 */
const S = {
  step: 0,                    // 0 표지 / 1 목록 / 2 달력 / 3 교재비 / 4 완료
  openGroup: null,
  data: {},                   // gid -> { marks:{ 'YYYY-MM-DD': '정|클|보|휴' }, feeMode, feeAmount, textbook, confirmed }
  history: [],                // 변경내역
};
GROUPS.forEach(g=>{
  S.data[g.id] = { marks:seedMarks(g), feeMode:null, feeAmount:g.materialFee, textbook:g.textbook, confirmed:false, touchedCal:false };
});

/* 요일 규칙 + 공휴일로 초기 마킹 */
function seedMarks(g){
  const m={}; const n=dim(YEAR,MONTH);
  for(let d=1; d<=n; d++){
    const w=dowOf(YEAR,MONTH,d), key=iso(YEAR,MONTH,d);
    const kind=g.days[w];
    if(!kind) continue;
    m[key] = HOLI[key] ? "휴" : (kind==="클" ? "클" : "정");
  }
  return m;
}
function countOf(gid){
  const m=S.data[gid].marks; let 정=0,클=0,보=0,휴=0;
  Object.values(m).forEach(v=>{ if(v==="정")정++; else if(v==="클")클++; else if(v==="보")보++; else if(v==="휴")휴++; });
  return {정,클,보,휴, total:정+보};
}
function baseTarget(g){ return g.weekN*4; }   // 기준 = 주당×4 (원장 결정 대기 → 표시만)

/* 게이트 판정 */
function gateOf(gid){
  const g=GROUPS.find(x=>x.id===gid), st=S.data[gid];
  const need=[];
  if(!st.touchedCal) need.push("수업일 확인");
  if(st.feeMode===null) need.push("교재비");
  return need;
}
function allReady(){ return GROUPS.every(g=>gateOf(g.id).length===0); }

/* ── 렌더 ── */
const app=document.getElementById("app");
function render(){
  document.getElementById("pg").style.width = (S.step/4*100)+"%";
  document.getElementById("hStep").textContent = ["표지","반별 확인","수업일 달력","교재비","완료"][S.step];
  /* PC에서만 목록을 2단으로 (모바일에선 클래스가 있어도 CSS가 무시) */
  app.classList.toggle("list-2col", S.step===1);
  if(S.step===0) return renderCover();
  if(S.step===1) return renderList();
  if(S.step===2) return renderCal();
  if(S.step===4) return renderDone();
  renderList();
}

function renderCover(){
  const totalCls = GROUPS.reduce((a,g)=>a+g.classes.length,0);
  /* 이번 달 안내문 — 전부 데이터에서 계산한다(하드코딩 금지) */
  const notes=[];
  const hs=Object.entries(HOLI).filter(([k])=>Number(k.slice(0,4))===YEAR && Number(k.slice(5,7))===MONTH);
  if(hs.length){
    const txt=hs.map(([k,v])=>`${Number(k.slice(8,10))}일(${DOWN[new Date(k).getDay()]}) ${v}`).join(", ");
    notes.push(`<b>공휴일</b> ${txt} — 미리 휴강으로 빼 뒀습니다`);
  } else notes.push(`이번 달 <b>공휴일 없음</b>`);
  const ex=(EXAM["하남고등학교"]||[]).filter(e=>e.month===MONTH);
  notes.push(ex.length
    ? `담당 학교(하남고) <b>${ex[0].term} ${MONTH}/${ex[0].days.join(",")}</b> → 내신교재·직전보강 확인 필요`
    : `담당 학교(하남고) ${MONTH}월 지필 <b>없음</b> → 내신교재·직전보강 질문 없음`);
  app.innerHTML = `
  <div class="cover">
    <h2>${MONTH}월 수업계획</h2>
    <div class="sub">윤재영 선생님 · ${totalCls}개 반 (일정 ${GROUPS.length}묶음)</div>
    <ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul>
    <div class="note">
      ✔ 지난달 내용은 <b>이미 채워져</b> 있습니다. 바뀐 것만 고치시면 됩니다.<br>
      ✱ 다만 <b>수업 횟수는 매달 달라져서</b> 묶음마다 달력을 한 번 봐 주셔야 합니다.
    </div>
  </div>`;
  setBar(`${MONTH}월 계획 · ${GROUPS.length}묶음`, "확인하러 가기", ()=>{ S.step=1; render(); });
}

function renderList(){
  let h = "";
  GROUPS.forEach(g=>{
    const st=S.data[g.id], c=countOf(g.id), need=gateOf(g.id);
    const ok = need.length===0;
    const feeTxt = st.feeMode===null ? "미확인"
      : st.feeMode==="none" ? "없음"
      : st.feeMode==="self" ? "개별구매"
      : (st.feeAmount||0).toLocaleString()+"원";
    h += `
    <div class="card">
      <div class="ch">
        <div class="ct">${esc(g.label)}
          <div class="cs">${g.classes.length}개 반 · ${esc(g.classes.slice(0,2).join(", "))}${g.classes.length>2?" 외 "+(g.classes.length-2):""}</div>
        </div>
        <span class="badge ${ok?"b-ok":"b-need"}">${ok?"확인됨 ✓":"확인 "+need.length+"건"}</span>
      </div>
      <div style="padding:0 14px 12px">
        <div class="cnt ${c.total<baseTarget(g)?"warn":""}">
          <span>9월 <span class="n">${c.total}</span>회</span>
          <span class="muted">기준 ${baseTarget(g)}회</span>
          ${c.클?`<span class="badge b-clinic">클리닉 ${c.클}</span>`:""}
          ${c.휴?`<span class="muted">휴강 ${c.휴}</span>`:""}
          ${!st.touchedCal?`<span class="badge b-need">달력 확인 필요</span>`:""}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn sm" style="flex:1" data-cal="${g.id}">📅 수업일 ${st.touchedCal?"수정":"확인"}</button>
          <button class="btn sm" style="flex:1" data-fee="${g.id}">📗 교재비 · ${esc(feeTxt)}</button>
        </div>
      </div>
    </div>`;
  });
  h += `<div class="log" id="logBox">${renderLog()}</div>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{ S.openGroup=b.dataset.cal; S.step=2; render(); });
  app.querySelectorAll("[data-fee]").forEach(b=>b.onclick=()=>openFee(b.dataset.fee));
  const done = allReady();
  const tot = GROUPS.reduce((a,g)=>a+countOf(g.id).total,0);
  setBar(`<b>9월 총 ${tot}회</b><br>${done?"확인 완료":"확인할 것 "+GROUPS.filter(g=>gateOf(g.id).length).length+"묶음"}`,
    done?"9월 계획 제출":"제출 (확인 필요)", ()=>{
      if(!done){ toast("확인 안 된 묶음이 있습니다","이동",()=>{
          const g=GROUPS.find(x=>gateOf(x.id).length); if(g){ S.openGroup=g.id; S.step=2; render(); }
        }); return; }
      S.step=4; render();
    }, !done);
}

function renderLog(){
  if(!S.history.length) return "";
  return "<b>변경 내역</b><br>" + S.history.slice(-6).map(x=>"· "+esc(x)).join("<br>");
}

function renderCal(){
  const g=GROUPS.find(x=>x.id===S.openGroup), st=S.data[g.id];
  const n=dim(YEAR,MONTH), first=dowOf(YEAR,MONTH,1);
  let cells="";
  for(let i=0;i<first;i++) cells+=`<div class="cell pad"></div>`;
  for(let d=1; d<=n; d++){
    const key=iso(YEAR,MONTH,d), w=dowOf(YEAR,MONTH,d);
    const mk=st.marks[key];
    let cls="cell", tag="";
    if(!mk){ cls+= HOLI[key]?" holi":" off"; }
    else if(mk==="정"){ cls+=" on"; tag="수업"; }
    else if(mk==="클"){ cls+=" clinic"; tag="클리닉"; }
    else if(mk==="보"){ cls+=" boost"; tag="직전보강"; }
    else if(mk==="휴"){ cls+=" cancel"; tag="휴강"; }
    cells+=`<button class="${cls}" data-d="${d}" aria-label="${MONTH}월 ${d}일 ${tag||"수업없음"}">
      <span class="d">${d}</span>${tag?`<span class="t">${tag}</span>`:""}
      ${HOLI[key]?'<span class="exam">휴</span>':""}
    </button>`;
  }
  const c=countOf(g.id), tgt=baseTarget(g);
  app.innerHTML=`
  <div class="card">
    <div class="ch">
      <div class="ct">${esc(g.label)}
        <div class="cs">${esc(g.classes.join(" / "))}</div>
      </div>
    </div>
    <div class="calwrap">
     <div class="calmain">
      <div class="calhd"><span class="m">${YEAR}년 ${MONTH}월</span>
        <button class="btn sm ghost" id="reseed">요일대로 다시 깔기</button></div>
      <div class="grid">
        ${DOWN.map((w,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}
        ${cells}
      </div>
     </div>
     <div class="calside">
      <div class="legend">
        <span><i style="background:#6ee7b7"></i>수업</span>
        <span><i style="background:#c4b5fd"></i>클리닉</span>
        <span><i style="background:#f9a8d4"></i>직전보강</span>
        <span><i style="background:#d1d5db"></i>휴강</span>
        <span><i style="background:#fbd5d1"></i>공휴일</span>
      </div>
      <div class="cnt ${c.total<tgt?"warn":""}">
        <span>정규+보강 <span class="n">${c.total}</span>회</span>
        <span class="muted">기준 ${tgt}회</span>
        ${c.클?`<span class="badge b-clinic">클리닉 ${c.클}회</span>`:""}
        ${c.total<tgt?`<span style="width:100%;font-size:12px">부족 ${tgt-c.total}회 — 보강은 <b>선택</b>입니다. 이대로 제출해도 됩니다.</span>`:""}
      </div>
      <div class="gate" style="margin:12px 4px 0">
        <div class="gt">날짜를 눌러 바꿉니다</div>
        <div class="gd">수업 → 클리닉 → 휴강 → 직전보강을 고를 수 있습니다.
          일요일·공휴일도 <b>직접 수업으로 지정</b>할 수 있습니다(과목별로 선생님이 정합니다).</div>
      </div>
     </div>
    </div>
  </div>`;
  app.querySelectorAll(".cell[data-d]").forEach(b=>b.onclick=()=>openDay(g.id, Number(b.dataset.d)));
  document.getElementById("reseed").onclick=()=>{
    const before=JSON.stringify(st.marks);
    st.marks=seedMarks(g);
    S.history.push(`${g.label} — 요일 규칙대로 되돌림`);
    toast("요일 규칙대로 되돌렸습니다","되살리기",()=>{ st.marks=JSON.parse(before); render(); });
    render();
  };
  setBar(`<b>${c.total}회</b> / 기준 ${tgt}회`, "이 묶음 확인 완료", ()=>{
    st.touchedCal=true; S.step=1; S.openGroup=null; render();
  });
}

function renderDone(){
  const tot=GROUPS.reduce((a,g)=>a+countOf(g.id).total,0);
  const cl=GROUPS.reduce((a,g)=>a+countOf(g.id).클,0);
  app.innerHTML=`
  <div class="card"><div class="ch"><div class="ct">✅ 9월 계획 제출됨
    <div class="cs">제출 시각 2026-08-17 · 원장 확인 후 9/1에 반영됩니다</div></div></div>
    <div style="padding:0 14px 14px">
      <div class="cnt"><span>정규+보강 <span class="n">${tot}</span>회</span>
        <span class="badge b-clinic">클리닉 ${cl}회</span></div>
      <div class="gd" style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6">
        수정이 필요하면 마감(8/22) 전까지 이 링크로 다시 들어와 고치시면 됩니다.
      </div>
    </div></div>`;
  setBar("제출 완료","처음으로",()=>{ S.step=0; render(); });
}

/* ── 하단바 ── */
function setBar(sumHTML, btnText, onClick, warn){
  document.getElementById("barSum").innerHTML=sumHTML;
  const b=document.getElementById("barBtn");
  b.textContent=btnText; b.className="btn "+(warn?"ghost":"pri");
  b.onclick=onClick;
}

/* ── 바텀시트: 날짜 성격 ── */
function openDay(gid, d){
  const st=S.data[gid], key=iso(YEAR,MONTH,d), cur=st.marks[key]||null;
  const w=DOWN[dowOf(YEAR,MONTH,d)], holi=HOLI[key];
  const opts=[
    ["정","🟢","수업","정규 수업으로 셉니다"],
    ["클","🟣","클리닉","보충·질의 시간. 정규 회차에 안 셉니다"],
    ["보","🌸","직전보강","시험 직전 추가 수업"],
    ["휴","⬜","휴강","이 날은 수업하지 않습니다"],
    [null,"·","수업 없는 날","달력에서 비웁니다"],
  ];
  sheet(`${MONTH}월 ${d}일 (${w})${holi?" · "+holi:""}`,
    holi ? "공휴일입니다. 그래도 수업하시면 <b>수업</b>을 고르세요." : "이 날의 성격을 골라주세요.",
    opts.map(([v,ic,tt,td])=>({
      sel: cur===v, ic, tt, td,
      on:()=>{
        const before=cur;
        if(v===null) delete st.marks[key]; else st.marks[key]=v;
        st.touchedCal=true;
        S.history.push(`${GROUPS.find(g=>g.id===gid).label} ${MONTH}/${d} → ${tt}`);
        closeSheet();
        toast(`${MONTH}/${d} ${tt}`,"되돌리기",()=>{
          if(before===null||before===undefined) delete st.marks[key]; else st.marks[key]=before;
          render();
        });
        render();
      }
    })));
}

/* ── 바텀시트: 교재비 (없음 / 개별구매 / 금액) ── */
const TIERS=[9000,19000,29000,39000,49000,59000,69000,79000];
function openFee(gid){
  const g=GROUPS.find(x=>x.id===gid), st=S.data[gid];
  const pan=document.getElementById("sheetPan");
  pan.innerHTML=`
    <div class="hdl"></div>
    <h3>교재비 · ${esc(g.label)}</h3>
    <div class="sh">교재비는 <b>교습비에 포함</b>해 교육청에 신고합니다. 셋 중 하나를 반드시 고르셔야 합니다.</div>
    <button class="opt ${st.feeMode==="none"?"sel":""}" data-m="none">
      <span class="ic" style="background:#f1f5f9">⬜</span>
      <span class="tx"><span class="tt">없음</span><span class="td">교재를 쓰지 않습니다</span></span></button>
    <button class="opt ${st.feeMode==="self"?"sel":""}" data-m="self">
      <span class="ic" style="background:#eff6ff">🛒</span>
      <span class="tx"><span class="tt">개별구매</span>
        <span class="td">학생이 직접 삽니다. 학원이 청구하지 않습니다</span></span></button>
    <button class="opt ${st.feeMode==="amount"?"sel":""}" data-m="amount">
      <span class="ic" style="background:#fff7ed">💰</span>
      <span class="tx"><span class="tt">학원 청구</span><span class="td">아래 구간에서 금액 선택</span></span></button>
    <div id="feeAmtBox" class="${st.feeMode==="amount"?"":"hide"}">
      <div class="f"><label>금액 <span class="req">*</span></label>
        <select id="feeAmt">
          <option value="">선택하세요</option>
          ${TIERS.map(t=>`<option value="${t}" ${st.feeAmount===t?"selected":""}>${t.toLocaleString()}원</option>`).join("")}
        </select>
        <div class="hint">정해진 8개 구간에서만 고를 수 있습니다.</div>
      </div>
    </div>
    <div class="f"><label>사용 교재명 ${st.feeMode==="amount"||st.feeMode==="self"?'<span class="req">*</span>':'<span class="muted">(선택)</span>'}</label>
      <input id="feeBook" value="${esc(st.textbook)}" placeholder="예) 해커스 중학영문법 2학년"/>
      <div class="hint" id="bookHint">정규 교재와 내신 교재가 다르면 <b>둘 다</b> 적어주세요.</div>
      <div class="errmsg hide" id="bookErr">교재를 청구하거나 개별구매하게 하려면 교재명이 필요합니다.</div>
    </div>
    <button class="btn pri full" id="feeSave" style="margin-top:6px">저장</button>`;
  openSheet();

  let mode=st.feeMode;
  const sync=()=>{
    pan.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.dataset.m===mode));
    pan.querySelector("#feeAmtBox").classList.toggle("hide", mode!=="amount");
    pan.querySelector(".f label .req, .f label .muted");
  };
  pan.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ mode=o.dataset.m; sync(); });
  pan.querySelector("#feeSave").onclick=()=>{
    const book=pan.querySelector("#feeBook").value.trim();
    const amt=Number(pan.querySelector("#feeAmt")?.value||0);
    const bookErr=pan.querySelector("#bookErr"), bookIn=pan.querySelector("#feeBook");
    if(mode===null||mode===undefined){ toast("없음 / 개별구매 / 학원청구 중 하나를 골라주세요"); return; }
    if(mode==="amount" && !amt){ toast("금액을 골라주세요"); return; }
    if((mode==="amount"||mode==="self") && !book){
      bookErr.classList.remove("hide"); bookIn.classList.add("err"); bookIn.focus(); return; }
    st.feeMode=mode; st.feeAmount = mode==="amount"?amt:null; st.textbook=book;
    S.history.push(`${g.label} 교재비 → ${mode==="none"?"없음":mode==="self"?"개별구매":amt.toLocaleString()+"원"}`);
    closeSheet(); render();
  };
}

/* ── 시트 공통 ── */
function sheet(title, sub, options){
  const pan=document.getElementById("sheetPan");
  pan.innerHTML=`<div class="hdl"></div><h3>${title}</h3><div class="sh">${sub}</div>`+
    options.map((o,i)=>`<button class="opt ${o.sel?"sel":""}" data-i="${i}">
      <span class="ic" style="background:#f8fafc">${o.ic}</span>
      <span class="tx"><span class="tt">${esc(o.tt)}</span><span class="td">${esc(o.td)}</span></span></button>`).join("")+
    `<button class="btn ghost full" data-close="1" style="margin-top:4px">닫기</button>`;
  pan.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>options[Number(b.dataset.i)].on());
  openSheet();
}
const sheetEl=document.getElementById("sheet");
function openSheet(){ sheetEl.classList.add("open"); }
function closeSheet(){ sheetEl.classList.remove("open"); }
sheetEl.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeSheet(); });

/* ── 토스트 (되돌리기 8초) ── */
let toastT=null;
function toast(msg, actionText, action){
  const host=document.getElementById("toastHost");
  host.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${actionText?`<button id="tAct">${esc(actionText)}</button>`:""}</div>`;
  clearTimeout(toastT); toastT=setTimeout(()=>host.innerHTML="",8000);
  const b=document.getElementById("tAct");
  if(b) b.onclick=()=>{ host.innerHTML=""; clearTimeout(toastT); action&&action(); };
}

/* 헤더를 계산된 대상월/마감으로 채운다 */
(function initHeader(){
  const due=dueDate(YEAR,MONTH);
  document.getElementById("hTitle").textContent=`${YEAR}년 ${MONTH}월 수업계획`;
  const dTxt=`${due.getMonth()+1}/${due.getDate()}(${DOWN[due.getDay()]})`;
  const left=Math.ceil((due - new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()))/86400000);
  document.getElementById("hDue").textContent = left>=0 ? `마감 ${dTxt} · D-${left}` : `마감 ${dTxt} 지남`;
  document.title=`[윤재영] ${MONTH}월 수업계획`;
})();

render();
</script>
</body>
</html>
